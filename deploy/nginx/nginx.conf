user nginx;
worker_processes auto;
worker_rlimit_nofile 8192;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    charset utf-8;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Fotos y documentos (MAX_UPLOAD_MB=25 + margen multipart).
    # Los planos tienen su propio límite en cctv.conf (PLAN_MAX_UPLOAD_MB=200).
    client_max_body_size 30m;
    client_body_timeout 60s;
    client_header_timeout 15s;
    send_timeout 60s;

    # --- Compresión
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript
               text/javascript application/manifest+json image/svg+xml application/x-yaml;

    # --- Limitación de peticiones (protección contra fuerza bruta y abuso)
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    # Teselas del plano: cada cambio de zoom pide 20-40 a la vez
    limit_req_zone $binary_remote_addr zone=tiles:10m rate=150r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    include /etc/nginx/conf.d/cctv.conf;
}
