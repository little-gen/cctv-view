# Servidor estático de la SPA (detrás del reverse proxy)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Ficheros con hash en el nombre: caché de un año
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html nunca en caché, para recibir siempre la última versión tras un despliegue
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Rutas del cliente (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
